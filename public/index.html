<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:#2d3148;
      --text:#e8eaf6; --muted:#7b82a8; --accent:#6c63ff;
    }
    html,body { height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; }
    .app { display:flex; flex-direction:column; min-height:100vh; }

    header { display:flex; align-items:center; justify-content:space-between; padding:18px 32px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
    .logo { display:flex; align-items:center; gap:10px; font-size:1.15rem; font-weight:700; }
    .logo-icon { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#6c63ff,#9c8fff); display:flex; align-items:center; justify-content:center; font-size:1rem; }
    .header-right { display:flex; align-items:center; gap:12px; }
    .last-updated { color:var(--muted); font-size:.8rem; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:8px; border:none; cursor:pointer; font-size:.875rem; font-weight:600; transition:all .15s; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-primary:hover { background:#7c74ff; transform:translateY(-1px); box-shadow:0 4px 12px rgba(108,99,255,.4); }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--border); }
    .btn-ghost:hover { color:var(--text); border-color:var(--muted); }

    main { flex:1; padding:28px 32px; max-width:1400px; margin:0 auto; width:100%; }

    .state-center { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:16px; text-align:center; }
    .spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
    .spinner-sm { width:14px; height:14px; border-width:2px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .error-box { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); border-radius:12px; padding:20px 28px; color:#fca5a5; }

    .total-banner { background:linear-gradient(135deg,#1e1b4b,#312e81); border:1px solid #3730a3; border-radius:16px; padding:24px 32px; display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
    .total-num { font-size:3.5rem; font-weight:800; line-height:1; letter-spacing:-2px; }
    .total-label { color:#a5b4fc; font-size:.9rem; margin-top:4px; }
    .rates { display:flex; gap:32px; }
    .rate-item { text-align:right; }
    .rate-value { font-size:1.6rem; font-weight:700; color:#c7d2fe; }
    .rate-label { font-size:.75rem; color:#818cf8; margin-top:2px; }

    .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:14px; margin-bottom:28px; }
    .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 20px 16px; position:relative; overflow:hidden; transition:transform .15s,box-shadow .15s; }
    .stat-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.4); }
    .stat-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--card-color,var(--accent)); }
    .stat-count { font-size:2.4rem; font-weight:800; line-height:1; letter-spacing:-1px; color:var(--card-color,var(--text)); }
    .stat-name { font-size:.8rem; color:var(--muted); margin-top:6px; font-weight:500; text-transform:uppercase; letter-spacing:.5px; }
    .stat-pct { font-size:.75rem; color:var(--muted); margin-top:3px; }
    .stat-icon { position:absolute; right:16px; top:16px; font-size:1.4rem; opacity:.3; }

    .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px; }
    .card-title { font-size:.85rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; margin-bottom:18px; }

    .ribbon { transition:opacity .15s; cursor:default; }
    .ribbon:hover { opacity:.75 !important; }

    .charts-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:28px; }
    @media (max-width:900px) { .charts-row { grid-template-columns:1fr; } }
    .chart-wrap { position:relative; height:220px; }

    .funnel-row { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
    .funnel-label { width:110px; font-size:.8rem; color:var(--muted); text-align:right; flex-shrink:0; }
    .funnel-bar-outer { flex:1; background:var(--surface2); border-radius:6px; height:28px; overflow:hidden; }
    .funnel-bar-inner { height:100%; border-radius:6px; display:flex; align-items:center; padding-left:10px; font-size:.8rem; font-weight:700; color:#fff; transition:width .6s cubic-bezier(.4,0,.2,1); min-width:2px; }
    .funnel-count { width:32px; text-align:right; font-size:.85rem; font-weight:700; flex-shrink:0; }

    .recent-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:.875rem; }
    thead th { text-align:left; padding:10px 14px; color:var(--muted); font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.6px; border-bottom:1px solid var(--border); }
    tbody tr { border-bottom:1px solid var(--border); transition:background .1s; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:var(--surface2); }
    tbody td { padding:11px 14px; }
    .status-pill { display:inline-block; padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:700; letter-spacing:.3px; text-transform:uppercase; }

    .unmapped { background:rgba(245,158,11,.05); border:1px solid rgba(245,158,11,.2); border-radius:10px; padding:14px 18px; margin-bottom:20px; font-size:.85rem; color:#fcd34d; }
    .unmapped strong { display:block; margin-bottom:6px; }

    @media (max-width:700px) {
      header { padding:14px 16px; }
      main { padding:16px; }
      .total-banner { flex-direction:column; gap:16px; text-align:center; }
      .rates { justify-content:center; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><div class="logo-icon">&#128202;</div> Job Tracker</div>
    <div class="header-right">
      <span class="last-updated" id="lastUpdated"></span>
      <button class="btn btn-ghost" onclick="changeSource()">Change source</button>
      <button class="btn btn-primary" id="refreshBtn" onclick="loadData(true)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        Update Data
      </button>
    </div>
  </header>
  <main id="main">
    <div class="state-center"><div class="spinner"></div><p style="color:var(--muted)">Loading…</p></div>
  </main>
</div>

<script>
// ── Status metadata ────────────────────────────────────────────────────────────
const STATUS_META = {
  Submitted:     { color:'#3b82f6', icon:'📤', bg:'rgba(59,130,246,.15)',  text:'#93c5fd' },
  Ghosted:       { color:'#6b7280', icon:'👻', bg:'rgba(107,114,128,.15)', text:'#d1d5db' },
  Rejected:      { color:'#ef4444', icon:'✗',  bg:'rgba(239,68,68,.15)',   text:'#fca5a5' },
  Interviews:    { color:'#f59e0b', icon:'🎤', bg:'rgba(245,158,11,.15)',  text:'#fcd34d' },
  'No Interview':{ color:'#f97316', icon:'🚫', bg:'rgba(249,115,22,.15)',  text:'#fdba74' },
  '2nd Round':   { color:'#8b5cf6', icon:'🔄', bg:'rgba(139,92,246,.15)',  text:'#c4b5fd' },
  Offers:        { color:'#10b981', icon:'🎉', bg:'rgba(16,185,129,.15)',  text:'#6ee7b7' },
  Withdrawn:     { color:'#94a3b8', icon:'↩',  bg:'rgba(148,163,184,.15)', text:'#cbd5e1' },
};
const STATUS_ORDER = ['Submitted','Ghosted','No Interview','Rejected','Interviews','2nd Round','Offers','Withdrawn'];

// ── Data normalisation (mirrors server.js) ────────────────────────────────────
const BLANK_RE = /^(n\s*\/?\s*a|none|null|-+|–|—|tbd|undefined|empty|\?)$/i;
function clean(v) { const s = String(v ?? '').trim(); return BLANK_RE.test(s) ? '' : s; }

const STATUS_MAP = {
  applied:'Submitted', submit:'Submitted', submitted:'Submitted', 'application submitted':'Submitted',
  sent:'Submitted', new:'Submitted', pending:'Submitted', 'in review':'Submitted',
  reviewed:'Submitted', 'under review':'Submitted',
  ghosted:'Ghosted', 'no response':'Ghosted', 'no reply':'Ghosted',
  unanswered:'Ghosted', silence:'Ghosted', silent:'Ghosted',
  rejected:'Rejected', rejection:'Rejected', denied:'Rejected', declined:'Rejected',
  'not selected':'Rejected', 'not a fit':'Rejected', 'not moving forward':'Rejected',
  'position filled':'Rejected', passed:'Rejected',
  interview:'Interviews', interviewing:'Interviews', 'phone screen':'Interviews',
  'phone interview':'Interviews', screening:'Interviews', 'first round':'Interviews',
  '1st round':'Interviews', 'round 1':'Interviews', 'initial interview':'Interviews',
  'technical screen':'Interviews', 'recruiter call':'Interviews',
  'hiring manager':'Interviews', 'video interview':'Interviews',
  'on-site':'Interviews', onsite:'Interviews',
  '2nd round':'2nd Round', 'second round':'2nd Round', 'round 2':'2nd Round',
  'final round':'2nd Round', 'final interview':'2nd Round', 'take home':'2nd Round',
  'technical interview':'2nd Round', 'panel interview':'2nd Round',
  loop:'2nd Round', superday:'2nd Round', '3rd round':'2nd Round',
  'third round':'2nd Round', 'round 3':'2nd Round',
  'no interview':'No Interview', 'rejected before interview':'No Interview',
  'application rejected':'No Interview',
  offer:'Offers', 'offer received':'Offers', hired:'Offers', accepted:'Offers',
  'offer accepted':'Offers', 'offer extended':'Offers', 'verbal offer':'Offers',
  withdrawn:'Withdrawn', withdrew:'Withdrawn', 'not interested':'Withdrawn',
  rescinded:'Withdrawn', 'offer rescinded':'Withdrawn', 'rescinded offer':'Withdrawn',
};

function normalise(raw) {
  const key = (raw || '').toLowerCase().trim();
  if (STATUS_MAP[key]) return STATUS_MAP[key];
  for (const [p, l] of Object.entries(STATUS_MAP)) { if (key.includes(p)) return l; }
  return null;
}

function parseCSV(text) {
  return text.split(/\r?\n/).map(line => {
    const cells = []; let cur = '', inQ = false;
    for (const ch of line) {
      if (ch === '"') inQ = !inQ;
      else if (ch === ',' && !inQ) { cells.push(cur); cur = ''; }
      else cur += ch;
    }
    cells.push(cur);
    return cells;
  }).filter(r => r.length > 1 || r[0]);
}

function parseRows(rows) {
  if (!rows || rows.length === 0) return { error: 'Sheet appears to be empty.' };

  const rawHeaders = rows[0].map(c => String(c ?? ''));
  const headers    = rawHeaders.map(h => h.toLowerCase().trim());

  const findCol = (...names) => {
    for (const n of names) { const i = headers.indexOf(n); if (i >= 0) return i; }
    for (const n of names) { const i = headers.findIndex(h => h.includes(n)); if (i >= 0) return i; }
    return -1;
  };

  const statusIdx  = findCol('status','stage','state','application status','application stage','phase','result','outcome');
  const companyIdx = findCol('company','employer','organization','company name','firm');
  const roleIdx    = findCol('role','position','title','job title','job','position title');
  const dateIdx    = findCol('date','date applied','applied date','application date','date submitted');

  if (statusIdx === -1) return { error: 'No Status column found.', hint: 'Name a column "Status" or "Stage".' };

  const dataRows = rows.slice(1).filter(r => clean(r[statusIdx]) !== '');
  const counts   = Object.fromEntries(STATUS_ORDER.map(s => [s, 0]));
  const rawCounts = {};
  let total = 0;

  dataRows.forEach(row => {
    total++;
    const raw    = clean(row[statusIdx]);
    const mapped = normalise(raw);
    if (mapped) counts[mapped]++;
    else rawCounts[raw] = (rawCounts[raw] || 0) + 1;
  });

  const recent = [...dataRows].reverse().slice(0, 8).map(row => ({
    company: companyIdx >= 0 ? clean(row[companyIdx]) : '',
    role:    roleIdx    >= 0 ? clean(row[roleIdx])    : '',
    date:    dateIdx    >= 0 ? clean(row[dateIdx])    : '',
    status:  clean(row[statusIdx]),
  }));

  const interviewed = counts['Interviews'] + counts['2nd Round'] + counts['Offers'];
  return {
    total, counts, unmappedStatuses: rawCounts, recent,
    rates: {
      responseRate:  total > 0 ? Math.round(((total - counts['Submitted'] - counts['Ghosted']) / total) * 100) : 0,
      interviewRate: total > 0 ? Math.round((interviewed / total) * 100) : 0,
      offerRate:     interviewed > 0 ? Math.round((counts['Offers'] / interviewed) * 100) : 0,
    },
    lastUpdated: new Date().toISOString(),
  };
}

// ── Config ────────────────────────────────────────────────────────────────────
function loadConfig() {
  try { return JSON.parse(localStorage.getItem('jt_config')); } catch { return null; }
}

// ── Load data ─────────────────────────────────────────────────────────────────
let donutChart = null;

async function loadData(force = false) {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner spinner-sm" style="border-width:2px;border-top-color:#fff"></div> Refreshing…';

  const cfg = loadConfig();
  if (!cfg) { window.location = '/setup.html'; return; }

  try {
    let rows;
    if (cfg.type === 'url') {
      const res = await fetch('/api/proxy?sheetId=' + encodeURIComponent(cfg.sheetId) + (force ? '&t=' + Date.now() : ''));
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        showError(d.error || 'Failed to fetch sheet', d.hint);
        return;
      }
      rows = parseCSV(await res.text());
    } else {
      rows = cfg.rows;
    }

    const data = parseRows(rows);
    if (data.error) { showError(data.error, data.hint); return; }
    render(data);
  } catch (e) {
    showError(e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> Update Data`;
  }
}

function showError(msg, hint) {
  document.getElementById('main').innerHTML = `
    <div class="state-center"><div class="error-box">
      <strong>&#9888; Error loading data</strong>
      <p style="margin-top:8px">${msg}</p>
      ${hint ? `<p style="margin-top:6px;opacity:.7">${hint}</p>` : ''}
      <button class="btn btn-primary" style="margin-top:16px" onclick="loadData(true)">Retry</button>
    </div></div>`;
}

function changeSource() {
  localStorage.removeItem('jt_config');
  window.location = '/setup.html';
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(data) {
  const { total, counts, rates, recent, lastUpdated, unmappedStatuses } = data;

  if (lastUpdated) {
    const d = new Date(lastUpdated);
    document.getElementById('lastUpdated').textContent = 'Updated ' + d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  }

  let html = '';

  html += `<div class="total-banner">
    <div><div class="total-num">${total}</div><div class="total-label">Total Applications</div></div>
    <div class="rates">
      <div class="rate-item"><div class="rate-value">${rates.responseRate}%</div><div class="rate-label">Response Rate</div></div>
      <div class="rate-item"><div class="rate-value">${rates.interviewRate}%</div><div class="rate-label">Interview Rate</div></div>
      <div class="rate-item"><div class="rate-value">${rates.offerRate}%</div><div class="rate-label">Offer / Interview</div></div>
    </div>
  </div>`;

  if (unmappedStatuses && Object.keys(unmappedStatuses).length > 0) {
    const items = Object.entries(unmappedStatuses).map(([k,v]) => `"${k}" (${v})`).join(', ');
    html += `<div class="unmapped"><strong>&#9888; Unrecognised status values (not counted)</strong><div style="color:var(--muted);font-family:monospace;font-size:.82rem">${items}</div></div>`;
  }

  html += '<div class="stat-grid">';
  STATUS_ORDER.forEach(name => {
    const count = counts[name] || 0;
    const meta  = STATUS_META[name] || { color:'#6c63ff', icon:'●' };
    const pct   = total > 0 ? Math.round((count / total) * 100) : 0;
    html += `<div class="stat-card" style="--card-color:${meta.color}">
      <div class="stat-icon">${meta.icon}</div>
      <div class="stat-count">${count}</div>
      <div class="stat-name">${name}</div>
      <div class="stat-pct">${pct}% of total</div>
    </div>`;
  });
  html += '</div>';

  html += `<div class="card" style="margin-bottom:28px">
    <div class="card-title">What Happened to Your Applications</div>
    <div id="flowContainer"></div>
  </div>`;

  html += `<div class="charts-row">
    <div class="card"><div class="card-title">Application Funnel</div><div id="funnelContainer"></div></div>
    <div class="card"><div class="card-title">Status Breakdown</div><div class="chart-wrap"><canvas id="donutChart"></canvas></div></div>
  </div>`;

  if (recent && recent.length > 0) {
    html += `<div class="card"><div class="card-title">Recent Applications</div><div class="recent-wrap"><table>
      <thead><tr><th>Company</th><th>Role</th><th>Date</th><th>Status</th></tr></thead><tbody>`;
    recent.forEach(r => {
      const mapped = normalise(r.status);
      const meta   = STATUS_META[mapped] || { bg:'rgba(107,114,128,.2)', text:'#9ca3af' };
      html += `<tr>
        <td><strong>${r.company || '—'}</strong></td>
        <td>${r.role || '—'}</td>
        <td style="color:var(--muted)">${r.date || '—'}</td>
        <td><span class="status-pill" style="background:${meta.bg};color:${meta.text}">${r.status || '—'}</span></td>
      </tr>`;
    });
    html += '</tbody></table></div></div>';
  }

  document.getElementById('main').innerHTML = html;
  buildFlow(counts, total, unmappedStatuses);
  buildFunnel(counts, total);
  buildDonut(counts);
}

// ── Branch flow diagram ───────────────────────────────────────────────────────
function buildFlow(counts, total, unmapped = {}) {
  const container = document.getElementById('flowContainer');
  if (!container || !total) return;

  const order    = ['Interviews','2nd Round','Offers','No Interview','Rejected','Ghosted','Withdrawn'];
  const branches = order
    .map(name => ({ name, count: counts[name] || 0, color: STATUS_META[name].color }))
    .filter(b => b.count > 0);

  const otherCount = Object.values(unmapped).reduce((a, b) => a + b, 0);
  if (otherCount > 0) branches.push({ name:'Other', count:otherCount, color:'#6b7280' });

  const W = 860, pad = 8;
  const rowH = 46, gap = 8;
  const H = Math.max(branches.length * (rowH + gap) - gap, rowH) + pad * 2;
  const srcX = 150, srcW = 26, tgtX = 560, tgtW = 26;
  const cx = (srcX + srcW + tgtX) / 2;
  const usableH = H - pad * 2;

  let srcY = pad, tgtY = pad;
  let ribbons = '', nodes = '', labels = '';

  branches.forEach(b => {
    const srcH = (b.count / total) * usableH;
    const sy0 = srcY, sy1 = srcY + srcH, ty0 = tgtY, ty1 = tgtY + rowH;
    const pct = Math.round((b.count / total) * 100);

    ribbons += `<path d="M ${srcX+srcW} ${sy0} C ${cx} ${sy0},${cx} ${ty0},${tgtX} ${ty0}
                L ${tgtX} ${ty1} C ${cx} ${ty1},${cx} ${sy1},${srcX+srcW} ${sy1} Z"
                fill="${b.color}" opacity="0.4" class="ribbon">
                <title>${b.name}: ${b.count} (${pct}%)</title></path>`;
    nodes += `<rect x="${tgtX}" y="${ty0}" width="${tgtW}" height="${rowH}" rx="5" fill="${b.color}"/>`;
    labels += `<text x="${tgtX+tgtW+14}" y="${ty0+rowH/2-3}"  fill="#e8eaf6" font-size="14" font-weight="700">${b.name}</text>
               <text x="${tgtX+tgtW+14}" y="${ty0+rowH/2+15}" fill="#7b82a8" font-size="12">${b.count} application${b.count===1?'':'s'} &middot; ${pct}%</text>`;
    srcY += srcH;
    tgtY += rowH + gap;
  });

  container.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-height:${H+20}px" preserveAspectRatio="xMidYMid meet">
    ${ribbons}
    <rect x="${srcX}" y="${pad}" width="${srcW}" height="${usableH}" rx="6" fill="#6c63ff"/>
    ${nodes}
    <text x="${srcX-14}" y="${H/2-6}"  text-anchor="end" fill="#e8eaf6" font-size="34" font-weight="800">${total}</text>
    <text x="${srcX-14}" y="${H/2+16}" text-anchor="end" fill="#a5b4fc" font-size="13" font-weight="600">Total Applied</text>
    ${labels}
  </svg>`;
}

// ── Funnel ────────────────────────────────────────────────────────────────────
function buildFunnel(counts, total) {
  const container = document.getElementById('funnelContainer');
  if (!container) return;
  const stages = [
    { name:'Submitted',    val: counts.Submitted || 0 },
    { name:'Got Response', val:(counts.Interviews||0)+(counts['2nd Round']||0)+(counts.Offers||0)+(counts.Rejected||0)+(counts['No Interview']||0) },
    { name:'Interview',    val:(counts.Interviews||0) },
    { name:'2nd Round',    val:(counts['2nd Round']||0) },
    { name:'Offer',        val:(counts.Offers||0) },
  ];
  const colors = ['#3b82f6','#f59e0b','#f59e0b','#8b5cf6','#10b981'];
  const max = Math.max(...stages.map(s => s.val), 1);
  container.innerHTML = stages.map((s, i) => {
    const w = Math.max((s.val / max) * 100, s.val > 0 ? 4 : 0);
    return `<div class="funnel-row">
      <div class="funnel-label">${s.name}</div>
      <div class="funnel-bar-outer"><div class="funnel-bar-inner" style="width:${w}%;background:${colors[i]}">${s.val > 0 && w > 15 ? s.val : ''}</div></div>
      <div class="funnel-count" style="color:${colors[i]}">${s.val}</div>
    </div>`;
  }).join('');
}

// ── Donut ─────────────────────────────────────────────────────────────────────
function buildDonut(counts) {
  if (donutChart) donutChart.destroy();
  const canvas = document.getElementById('donutChart');
  if (!canvas) return;
  const entries = Object.entries(counts).filter(([,v]) => v > 0);
  donutChart = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: entries.map(([k]) => k),
      datasets: [{ data: entries.map(([,v]) => v), backgroundColor: entries.map(([k]) => (STATUS_META[k]||{color:'#6c63ff'}).color), borderColor:'#1a1d27', borderWidth:3, hoverOffset:6 }],
    },
    options: {
      responsive:true, maintainAspectRatio:false, cutout:'65%',
      plugins: {
        legend: { position:'right', labels:{ color:'#7b82a8', padding:12, font:{size:12}, boxWidth:12 } },
        tooltip: {
          backgroundColor:'#1a1d27', borderColor:'#2d3148', borderWidth:1, titleColor:'#e8eaf6', bodyColor:'#7b82a8',
          callbacks: { label: ctx => `  ${ctx.label}: ${ctx.raw} (${Math.round(ctx.raw/ctx.dataset.data.reduce((a,b)=>a+b,0)*100)}%)` }
        }
      }
    }
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadData();
</script>
